<text x="346" y="136" text-anchor="end" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#8A9099">01</text>
<text x="404" y="126" font-size="17" font-weight="600" fill="#16191D">Replicate the confined-necking study</text>
<text x="404" y="148" font-size="13.5" fill="#8A9099">Held inside 316L, PH17-4 reaches ~60% strain.</text>
<text x="404" y="166" font-size="13.5" fill="#8A9099">On its own it snaps at 8%</text>
<circle cx="372" cy="260" r="8" fill="#EDEFF2" stroke="#2E5C8A" stroke-width="3"/>
<circle cx="372" cy="260" r="3" fill="#2E5C8A"/>
<line x1="381" y1="260" x2="390" y2="260" stroke="#2E5C8A" stroke-width="1.5"/>
<text x="346" y="264" text-anchor="end" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#8A9099">02</text>
<text x="404" y="254" font-size="17" font-weight="600" fill="#16191D">Implicit or explicit solver?</text>
<text x="404" y="276" font-size="13.5" fill="#8A9099">Explicit. Necking is a large-deformation instability</text>
<path d="M 370 268 C 370 294, 378 290, 338 306" fill="none" stroke="#8A9099" stroke-width="1.4" stroke-dasharray="3 3"/>
<circle cx="338" cy="306" r="3.5" fill="none" stroke="#8A9099" stroke-width="1.4"/>
<text x="326" y="302" text-anchor="end" font-size="13" font-weight="600" fill="#B87333">Implicit</text>
<text x="326" y="320" text-anchor="end" font-size="12" fill="#8A9099">Convergence dies at the neck</text>
<circle cx="372" cy="388" r="8" fill="#EDEFF2" stroke="#2E5C8A" stroke-width="3"/>
<circle cx="372" cy="388" r="3" fill="#2E5C8A"/>
<line x1="381" y1="388" x2="390" y2="388" stroke="#2E5C8A" stroke-width="1.5"/>
<text x="346" y="392" text-anchor="end" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#8A9099">03</text>
<text x="404" y="362" font-size="17" font-weight="600" fill="#16191D">How fast do you pull a static test</text>
<text x="404" y="382" font-size="17" font-weight="600" fill="#16191D">in a dynamic solver?</text>
<text x="404" y="404" font-size="13.5" fill="#8A9099">5 m/s. Kinetic energy under 5% of internal energy</text>
<path d="M 370 396 C 370 422, 378 418, 338 434" fill="none" stroke="#8A9099" stroke-width="1.4" stroke-dasharray="3 3"/>
<circle cx="338" cy="434" r="3.5" fill="none" stroke="#8A9099" stroke-width="1.4"/>
<text x="326" y="430" text-anchor="end" font-size="13" font-weight="600" fill="#B87333">50 m/s</text>
<text x="326" y="448" text-anchor="end" font-size="12" fill="#8A9099">Fractured at the grip, not the gauge</text>
<circle cx="372" cy="516" r="8" fill="#EDEFF2" stroke="#2E5C8A" stroke-width="3"/>
<circle cx="372" cy="516" r="3" fill="#2E5C8A"/>
<line x1="381" y1="516" x2="390" y2="516" stroke="#2E5C8A" stroke-width="1.5"/>
<text x="346" y="520" text-anchor="end" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#8A9099">04</text>
<text x="404" y="510" font-size="17" font-weight="600" fill="#16191D">How fine does the mesh need to be?</text>
<text x="404" y="532" font-size="13.5" fill="#8A9099">2 mm in the gauge. 0.5% stress change down to 1 mm</text>
<path d="M 370 524 C 370 550, 378 546, 338 562" fill="none" stroke="#8A9099" stroke-width="1.4" stroke-dasharray="3 3"/>
<circle cx="338" cy="562" r="3.5" fill="none" stroke="#8A9099" stroke-width="1.4"/>
<text x="326" y="558" text-anchor="end" font-size="13" font-weight="600" fill="#B87333">1 mm everywhere</text>
<text x="326" y="576" text-anchor="end" font-size="12" fill="#8A9099">No gain, 32k-element license cap</text>
<circle cx="372" cy="644" r="8" fill="#EDEFF2" stroke="#2E5C8A" stroke-width="3"/>
<circle cx="372" cy="644" r="3" fill="#2E5C8A"/>
<line x1="381" y1="644" x2="390" y2="644" stroke="#2E5C8A" stroke-width="1.5"/>
<text x="346" y="648" text-anchor="end" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#8A9099">05</text>
<text x="404" y="638" font-size="17" font-weight="600" fill="#16191D">Why is peak stress impossibly low?</text>
<text x="404" y="660" font-size="13.5" fill="#8A9099">One field on a stock card. Its equation of state was</text>
<text x="404" y="678" font-size="13.5" fill="#8A9099">switching off mass scaling for the whole model</text>
<path d="M 370 652 C 370 678, 378 674, 338 690" fill="none" stroke="#8A9099" stroke-width="1.4" stroke-dasharray="3 3"/>
<circle cx="338" cy="690" r="3.5" fill="none" stroke="#8A9099" stroke-width="1.4"/>
<text x="326" y="686" text-anchor="end" font-size="13" font-weight="600" fill="#B87333">Blame the mesh</text>
<text x="326" y="704" text-anchor="end" font-size="12" fill="#8A9099">Element quality checked good at 0.857</text>
<circle cx="372" cy="772" r="8" fill="#EDEFF2" stroke="#2E5C8A" stroke-width="3"/>
<circle cx="372" cy="772" r="3" fill="#2E5C8A"/>
<line x1="381" y1="772" x2="390" y2="772" stroke="#2E5C8A" stroke-width="1.5"/>
<text x="346" y="776" text-anchor="end" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#8A9099">06</text>
<text x="404" y="766" font-size="17" font-weight="600" fill="#16191D">Why does it break at 12% strain?</text>
<text x="404" y="788" font-size="13.5" fill="#8A9099">Not fracture. Stress pinned at 1003 MPa where the</text>
<text x="404" y="806" font-size="13.5" fill="#8A9099">hardening curve ran out, so plastic strain ran away</text>
<path d="M 370 780 C 370 806, 378 802, 338 818" fill="none" stroke="#8A9099" stroke-width="1.4" stroke-dasharray="3 3"/>
<circle cx="338" cy="818" r="3.5" fill="none" stroke="#8A9099" stroke-width="1.4"/>
<text x="326" y="814" text-anchor="end" font-size="13" font-weight="600" fill="#B87333">Raise the failure limit</text>
<text x="326" y="832" text-anchor="end" font-size="12" fill="#8A9099">Hides the bug, keeps the numbers wrong</text>
<circle cx="372" cy="900" r="8" fill="#EDEFF2" stroke="#2E5C8A" stroke-width="3"/>
<circle cx="372" cy="900" r="3" fill="#2E5C8A"/>
<line x1="381" y1="900" x2="390" y2="900" stroke="#2E5C8A" stroke-width="1.5"/>
<text x="346" y="904" text-anchor="end" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#8A9099">07</text>
<text x="404" y="894" font-size="17" font-weight="600" fill="#16191D">Can one number describe failure here?</text>
<text x="404" y="916" font-size="13.5" fill="#8A9099">No. A fixed per-element cutoff cannot represent</text>
<text x="404" y="934" font-size="13.5" fill="#8A9099">failure that confinement is actively delaying</text>
<path d="M 370 908 C 370 934, 378 930, 338 946" fill="none" stroke="#8A9099" stroke-width="1.4" stroke-dasharray="3 3"/>
<circle cx="338" cy="946" r="3.5" fill="none" stroke="#8A9099" stroke-width="1.4"/>
<text x="326" y="942" text-anchor="end" font-size="13" font-weight="600" fill="#B87333">Fixed strain threshold</text>
<text x="326" y="960" text-anchor="end" font-size="12" fill="#8A9099">Deletes the hard phase too early</text>
<circle cx="372" cy="1028" r="8" fill="#EDEFF2" stroke="#2E5C8A" stroke-width="3"/>
<circle cx="372" cy="1028" r="3" fill="#2E5C8A"/>
<line x1="381" y1="1028" x2="390" y2="1028" stroke="#2E5C8A" stroke-width="1.5"/>
<text x="346" y="1032" text-anchor="end" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#8A9099">08</text>
<text x="404" y="1022" font-size="17" font-weight="600" fill="#16191D">Which end do you measure force at?</text>
<text x="404" y="1044" font-size="13.5" fill="#8A9099">The fixed end. The pulled end reads the loading wave</text>
<path d="M 370 1036 C 370 1062, 378 1058, 338 1074" fill="none" stroke="#8A9099" stroke-width="1.4" stroke-dasharray="3 3"/>
<circle cx="338" cy="1074" r="3.5" fill="none" stroke="#8A9099" stroke-width="1.4"/>
<text x="326" y="1070" text-anchor="end" font-size="13" font-weight="600" fill="#B87333">Pulled end</text>
<text x="326" y="1088" text-anchor="end" font-size="12" fill="#8A9099">Ringing swamps the signal</text>
<circle cx="372" cy="1156" r="8" fill="#EDEFF2" stroke="#2E5C8A" stroke-width="3"/>
<circle cx="372" cy="1156" r="3" fill="#2E5C8A"/>
<line x1="381" y1="1156" x2="390" y2="1156" stroke="#2E5C8A" stroke-width="1.5"/>
<text x="346" y="1160" text-anchor="end" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#8A9099">09</text>
<text x="404" y="1150" font-size="17" font-weight="600" fill="#16191D">Does the layout matter, or just how much?</text>
<text x="404" y="1172" font-size="13.5" fill="#8A9099">25 specimens: 5 reinforcement counts x 5 volume fractions</text>
<circle cx="372" cy="1284" r="8" fill="#EDEFF2" stroke="#2E5C8A" stroke-width="3"/>
<circle cx="372" cy="1284" r="3" fill="#2E5C8A"/>
<line x1="381" y1="1284" x2="390" y2="1284" stroke="#2E5C8A" stroke-width="1.5"/>
<text x="346" y="1288" text-anchor="end" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#8A9099">10</text>
<text x="404" y="1278" font-size="17" font-weight="600" fill="#16191D">What came out</text>
<text x="404" y="1300" font-size="13.5" fill="#8A9099">Stiffness, yield, elongation and load sharing vs. volume fraction</text>
<line x1="60" y1="1342" x2="940" y2="1342" stroke="#C9CDD3" stroke-width="1"/>
<rect x="60" y="1367" width="18" height="4" fill="#2E5C8A"/>
<text x="86" y="1375" font-size="12.5" fill="#8A9099">path taken</text>
<circle cx="196" cy="1369" r="3.5" fill="none" stroke="#8A9099" stroke-width="1.4"/>
<text x="208" y="1375" font-size="12.5" fill="#8A9099">branch killed, and what killed it</text>
<text x="940" y="1375" text-anchor="end" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.6" fill="#8A9099">ANSYS EXPLICIT DYNAMICS / 25 RUNS</text>
</svg>